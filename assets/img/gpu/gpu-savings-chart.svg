<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="gpu-chart-title gpu-chart-desc" font-family='system-ui,-apple-system,"Segoe UI",Inter,sans-serif'>
<title id="gpu-chart-title">Solver time saved with GPU compute vs. CPU (STAR-CCM+ v17)</title>
<desc id="gpu-chart-desc">Line chart of percent elapsed solver time saved for A100, RTX 6000 and T4 GPU nodes across mesh base sizes from 1 m to 2 m. A100 saves 57 to 86 percent, RTX 6000 35 to 73 percent, T4 35 to 72 percent. Savings are largest at the finest mesh (1 m base size).</desc>
